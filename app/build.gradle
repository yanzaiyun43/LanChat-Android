plugins {
    id 'com.android.application'
}

// 版本号从 git 推导：发版直接 git tag v2.1 即可，无需改文件、无需 CI 自动 bump
def gitDescribe = { ->
    def out = new ByteArrayOutputStream()
    exec { executable 'git'; args 'describe', '--tags', '--always'; standardOutput out }
    out.toString().trim().replaceFirst('^v', '')
}
def gitCommitCount = { ->
    def out = new ByteArrayOutputStream()
    exec { executable 'git'; args 'rev-list', '--count', 'HEAD'; standardOutput out }
    out.toString().trim().toInteger()
}

android {
    namespace 'com.lans.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.lans.chat"
        minSdk 24
        targetSdk 34
        versionCode gitCommitCount() + 100
        versionName gitDescribe()
    }

    // CI 注入 LANCHAT_KEYSTORE_FILE（来自 GitHub Actions secret）时用固定签名；
    // 本地开发无该环境变量，debug 自动用默认 ~/.android/debug.keystore
    def fixedKeyFile = System.getenv('LANCHAT_KEYSTORE_FILE')
    def hasFixedKey = fixedKeyFile != null && rootProject.file(fixedKeyFile).exists()

    signingConfigs {
        lanchat {
            if (hasFixedKey) {
                storeFile rootProject.file(fixedKeyFile)
                storePassword System.getenv('LANCHAT_STORE_PASSWORD')
                keyAlias System.getenv('LANCHAT_KEY_ALIAS')
                keyPassword System.getenv('LANCHAT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (hasFixedKey) {
                signingConfig signingConfigs.lanchat
            }
        }
        release {
            if (hasFixedKey) {
                signingConfig signingConfigs.lanchat
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
}
