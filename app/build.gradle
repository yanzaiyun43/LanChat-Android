import java.math.BigDecimal

plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

task incrementVersion {
    doLast {
        def propsFile = rootProject.file('version.properties')
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        def code = props['VERSION_CODE'].toInteger() + 1
        def name = props['VERSION_NAME']
        def newName = (new BigDecimal(name) + new BigDecimal("0.01")).setScale(2, BigDecimal.ROUND_HALF_UP).toString()
        props.setProperty('VERSION_CODE', code.toString())
        props.setProperty('VERSION_NAME', newName)
        props.store(new FileOutputStream(propsFile), 'Version properties')
        println "Version incremented: ${name} -> ${newName}, code ${code - 1} -> ${code}"
    }
}

android {
    namespace 'com.lans.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.lans.chat"
        minSdk 24
        targetSdk 34
        versionCode versionProps['VERSION_CODE'].toInteger()
        versionName versionProps['VERSION_NAME']
    }

    signingConfigs {
        lanchat {
            storeFile rootProject.file('keystore/lanchat.jks')
            storePassword 'lanchat123'
            keyAlias 'lanchat'
            keyPassword 'lanchat123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lanchat
        }
        release {
            signingConfig signingConfigs.lanchat
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
}
