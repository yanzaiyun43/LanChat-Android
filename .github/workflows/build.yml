name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Write signing keystore
        env:
          LANCHAT_KEYSTORE: ${{ secrets.LANCHAT_KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$LANCHAT_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ks/lanchat.jks"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          LANCHAT_KEYSTORE_FILE: ${{ runner.temp }}/ks/lanchat.jks
          LANCHAT_STORE_PASSWORD: ${{ secrets.LANCHAT_STORE_PASSWORD }}
          LANCHAT_KEY_ALIAS: ${{ secrets.LANCHAT_KEY_ALIAS }}
          LANCHAT_KEY_PASSWORD: ${{ secrets.LANCHAT_KEY_PASSWORD }}

      - name: Upload APK (CI)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
